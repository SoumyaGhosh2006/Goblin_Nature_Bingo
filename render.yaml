# ==============================================================================
# RENDER BLUEPRINT SPECIFICATION — GOBLIN NATURE BINGO BACKEND
# ==============================================================================
# Declares automated cloud deployment settings for Render web service.

services:
  - type: web
    name: goblin-nature-bingo-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CORS_ORIGINS
        value: "*"
